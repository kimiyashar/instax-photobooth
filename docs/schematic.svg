<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <!-- leader arrowhead, matching the SEM callout's flat triangle -->
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="rgba(255,255,255,0.55)"/>
    </marker>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6a72"/>
      <stop offset="100%" stop-color="#243c42"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="720" fill="#0a0a0a"/>

  <!-- ══ title ═══════════════════════════════════════════════════════════ -->
  <text x="64" y="72" fill="rgba(255,255,255,0.94)" font-size="21"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="300">
    Instax photo booth
  </text>
  <text x="64" y="98" fill="rgba(255,255,255,0.42)" font-size="10.5"
        letter-spacing="0.14em">RASPBERRY PI 4 &#183; TOUCH DISPLAY 2 &#183; INSTAX MINI LINK</text>
  <line x1="64" y1="118" x2="228" y2="118" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>

  <!-- ══ the enclosure ═══════════════════════════════════════════════════ -->
  <g>
    <rect x="452" y="150" width="290" height="446" rx="22"
          fill="#131313" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>

    <!-- camera module -->
    <rect x="562" y="182" width="70" height="42" rx="7"
          fill="#1c1c1c" stroke="rgba(255,255,255,0.26)" stroke-width="1"/>
    <circle cx="597" cy="203" r="12" fill="#080808" stroke="rgba(255,255,255,0.34)" stroke-width="1"/>
    <circle cx="597" cy="203" r="5" fill="#2a3c42"/>
    <circle cx="593.5" cy="199.5" r="1.8" fill="rgba(255,255,255,0.5)"/>

    <!-- touchscreen, landscape -->
    <rect x="486" y="248" width="222" height="150" rx="9"
          fill="#0d0d0d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>
    <rect x="496" y="258" width="202" height="130" rx="4" fill="url(#screenGlow)" opacity="0.55"/>
    <!-- live mirrored preview, suggested -->
    <circle cx="597" cy="317" r="30" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.2"/>
    <circle cx="586" cy="310" r="2.6" fill="rgba(255,255,255,0.62)"/>
    <circle cx="608" cy="310" r="2.6" fill="rgba(255,255,255,0.62)"/>
    <path d="M585 325 Q597 335 609 325" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.4" stroke-linecap="round"/>
    <text x="506" y="275" fill="rgba(255,255,255,0.66)" font-size="8.5" letter-spacing="0.16em">LIVE &#183; MIRRORED</text>
    <!-- the "ready?" hand tap target — the only live region -->
    <rect x="646" y="342" width="46" height="40" rx="5" fill="rgba(255,255,255,0.07)"
          stroke="rgba(255,255,255,0.45)" stroke-width="1" stroke-dasharray="3 2.5"/>
    <text x="669" y="366" fill="rgba(255,255,255,0.72)" font-size="15" text-anchor="middle">&#9995;</text>

    <!-- print slot -->
    <rect x="486" y="430" width="222" height="12" rx="6" fill="#050505" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

    <!-- ejecting instax print -->
    <g>
      <rect x="540" y="442" width="114" height="140" rx="4" fill="#f4f2ee"/>
      <rect x="548" y="450" width="98" height="98" fill="#243c42"/>
      <circle cx="583" cy="486" r="9" fill="rgba(255,255,255,0.34)"/>
      <circle cx="613" cy="486" r="9" fill="rgba(255,255,255,0.34)"/>
      <path d="M578 508 Q597 524 616 508" fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ══ left leaders ════════════════════════════════════════════════════ -->
  <g stroke="rgba(255,255,255,0.30)" stroke-width="1" fill="none">
    <line x1="300" y1="203" x2="556" y2="203" marker-end="url(#ah)"/>
    <line x1="300" y1="300" x2="480" y2="300" marker-end="url(#ah)"/>
    <line x1="300" y1="362" x2="640" y2="362" marker-end="url(#ah)"/>
  </g>
  <g fill="rgba(255,255,255,0.90)" font-size="11.5" text-anchor="end" letter-spacing="0.03em">
    <text x="290" y="199">Camera Module 3 NoIR</text>
    <text x="290" y="296">Touch Display 2, 7&#8243;</text>
    <text x="290" y="358">&#8220;ready?&#8221; tap target</text>
  </g>
  <g fill="rgba(255,255,255,0.40)" font-size="9" text-anchor="end" letter-spacing="0.11em">
    <text x="290" y="215">RIBBON TO CAM/DISP 0</text>
    <text x="290" y="312">LANDSCAPE, ROTATED 90&#176;</text>
    <text x="290" y="374">THE ONLY LIVE REGION</text>
  </g>

  <!-- ══ right leaders ═══════════════════════════════════════════════════ -->
  <g stroke="rgba(255,255,255,0.30)" stroke-width="1" fill="none">
    <line x1="812" y1="436" x2="716" y2="436" marker-end="url(#ah)"/>
    <line x1="812" y1="520" x2="662" y2="520" marker-end="url(#ah)"/>
  </g>
  <g fill="rgba(255,255,255,0.90)" font-size="11.5" letter-spacing="0.03em">
    <text x="822" y="432">Instax Mini Link</text>
    <text x="822" y="516">Photo prints here</text>
  </g>
  <g fill="rgba(255,255,255,0.40)" font-size="9" letter-spacing="0.11em">
    <text x="822" y="448">FIRST-GEN &#183; PRINTS OVER BLUETOOTH</text>
    <text x="822" y="532">~15 S TO EJECT, ~90 S TO DEVELOP</text>
  </g>

  <!-- ══ inside the enclosure ════════════════════════════════════════════ -->
  <g>
    <rect x="64" y="428" width="326" height="182" rx="10" fill="none"
          stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="86" y="454" fill="rgba(255,255,255,0.52)" font-size="9" letter-spacing="0.15em">INSIDE THE ENCLOSURE</text>

    <!-- row 1 — pi board -->
    <rect x="86" y="470" width="44" height="32" rx="4" fill="#16211a" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
    <rect x="91" y="474" width="34" height="4" rx="1.5" fill="rgba(255,255,255,0.34)"/>
    <rect x="93" y="484" width="15" height="12" rx="2" fill="#0b0b0b"/>
    <rect x="113" y="486" width="9" height="8" rx="1.5" fill="#0b0b0b"/>
    <text x="146" y="484" fill="rgba(255,255,255,0.86)" font-size="10.5" letter-spacing="0.04em">Raspberry Pi 4</text>
    <text x="146" y="497" fill="rgba(255,255,255,0.34)" font-size="8" letter-spacing="0.1em">BOOKWORM 64-BIT, CONSOLE AUTOLOGIN</text>

    <!-- row 2 — bluetooth dongle -->
    <rect x="86" y="518" width="44" height="32" rx="4" fill="#1a1a1a" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
    <rect x="80" y="527" width="7" height="14" rx="1.5" fill="rgba(255,255,255,0.34)"/>
    <path d="M108 526 L113 531 L108 536 M108 526 L108 542 M108 542 L113 537 L108 532" fill="none"
          stroke="rgba(255,255,255,0.68)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="146" y="532" fill="rgba(255,255,255,0.86)" font-size="10.5" letter-spacing="0.04em">USB Bluetooth dongle</text>
    <text x="146" y="545" fill="rgba(255,255,255,0.34)" font-size="8" letter-spacing="0.1em">ONBOARD RADIO OFF &#8212; METAL BLOCKS IT</text>

    <!-- row 3 — power -->
    <rect x="86" y="566" width="44" height="32" rx="4" fill="#1a1a1a" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
    <path d="M111 572 L104 585 L113 585 L106 594" fill="none" stroke="rgba(255,255,255,0.58)"
          stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="146" y="580" fill="rgba(255,255,255,0.86)" font-size="10.5" letter-spacing="0.04em">5 V / 3 A USB-C</text>
    <text x="146" y="593" fill="rgba(255,255,255,0.34)" font-size="8" letter-spacing="0.1em">~10 W TYPICAL, ~13 W PEAK</text>
  </g>

  <!-- ══ bluetooth link, dongle → printer ════════════════════════════════
       routed off the box's right edge so it never crosses the row labels -->
  <path d="M392 534 C 418 534, 432 500, 452 462" fill="none"
        stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="421" y="424" fill="rgba(255,255,255,0.34)" font-size="8" text-anchor="middle"
        letter-spacing="0.14em">BLUETOOTH</text>
  <line x1="421" y1="432" x2="421" y2="498" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- ══ flow strip ══════════════════════════════════════════════════════ -->
  <g>
    <line x1="64" y1="640" x2="1056" y2="640" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <g fill="rgba(255,255,255,0.58)" font-size="9" letter-spacing="0.13em">
      <text x="64" y="666">TAP TO WAKE</text>
      <text x="224" y="666">LIVE MIRROR</text>
      <text x="384" y="666">TAP THE HAND</text>
      <text x="552" y="666">3 &#183; 2 &#183; 1</text>
      <text x="672" y="666">CAPTURE</text>
      <text x="808" y="666">PRINT OVER BLE</text>
      <text x="976" y="666">OUTRO</text>
    </g>
    <g fill="rgba(255,255,255,0.26)" font-size="9">
      <text x="188" y="666">&#8594;</text>
      <text x="348" y="666">&#8594;</text>
      <text x="516" y="666">&#8594;</text>
      <text x="636" y="666">&#8594;</text>
      <text x="772" y="666">&#8594;</text>
      <text x="940" y="666">&#8594;</text>
    </g>
  </g>

  <text x="64" y="700" fill="rgba(255,255,255,0.24)" font-size="8.5" letter-spacing="0.13em">
    KIMI YASHAR / NO LAPTOP, NO INTERNET AT RUNTIME
  </text>
</svg>
